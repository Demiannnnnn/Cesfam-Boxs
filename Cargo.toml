[workspace]
resolver = "2"
members = ["shared", "api", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Demian"]
license = "UNLICENSED"

[workspace.dependencies]
gestion-box-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
hostname = "0.4"
http-body-util = "0.1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
